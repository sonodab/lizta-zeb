<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" id="tc">
<title>Lizta</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lizta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: calmo, cara de app pronto na loja, nada de enfeite
   IDEA: cada lista é um cartão colorido de carteira; abrir inunda a tela com a cor dele
   PICTURE: a própria pilha de cartões pastel, e a tela cheia da cor ao abrir
   COLOUR and TYPE: fundo branco, tinta preta, cores pastel escolhidas por lista; Inter Tight
   LAYOUT: "Olá" grande, abas, pilha de cartões, barra escura flutuante; detalhe em tela cheia */
:root{color-scheme:light dark;--bg:light-dark(#e7e7e4,#0c0d0f);--ink:light-dark(#0f1012,#f3f3f1);--mute:light-dark(#8a8d93,#8d9097);--line:light-dark(#e6e6e3,#2a2c31);--soft:light-dark(#d9d9d5,#1a1b1e);--sheet:light-dark(#ffffff,#16171a);--field:light-dark(#f2f2f0,#232529);--dark:light-dark(#111214,#1d1f23);--cink:light-dark(#111214,#f4f4f2);--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
:root[data-mode=l]{color-scheme:light}:root[data-mode=d]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Inter Tight",system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;transition:transform .3s cubic-bezier(.32,.72,0,1),opacity .3s ease,background-color .3s ease}
.solid:active,.soft:active,.btn:active,.cta:active,.rb:active,.x:active,.vb:active,.plus:active{transform:scale(.95)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.34s;animation-timing-function:ease}
:focus-visible{outline:2px solid #3a7bff;outline-offset:2px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:560px;margin:0 auto;padding:calc(28px + var(--st)) 18px calc(130px + var(--sb))}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:18px;letter-spacing:-.03em;margin-bottom:26px}
.brand svg{width:30px;height:30px;flex:none}
[data-d=k] .brand{margin-bottom:18px}[data-d=m] .brand{margin-bottom:12px}
.hello{font-size:clamp(46px,14vw,62px);line-height:1;letter-spacing:-.045em;font-weight:700;margin:0}
.who{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px;font-size:14px}
.who b{font-weight:500;display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:#2fbf6b;flex:none}.dot.off{background:#b9bcc2}
.who b{display:none}
.who small{text-align:right;color:var(--mute);font-size:12px;line-height:1.3}
.who small span{display:block;color:var(--ink);font-size:13px}
.tabs{display:flex;gap:22px;margin:30px 0 12px}
.tabs button{font-size:18px;letter-spacing:-.02em;color:var(--mute);display:flex;align-items:center;gap:6px;min-height:44px}
.tabs button[aria-selected=true]{color:var(--ink)}
.tabs i{font-style:normal;font-size:11px;background:var(--soft);border-radius:99px;padding:2px 7px;color:var(--mute)}
.tabs .newb{display:none;align-items:center;gap:6px;min-height:44px;padding:0 16px 0 12px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:500;white-space:nowrap}
.tabs .vb{margin-left:auto;flex:none;width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--ink);justify-content:center}
.search{display:none;margin:0 0 14px}.search.on{display:block}
.note{font-size:12.5px;color:var(--mute);margin:-4px 2px 12px}
input{font:inherit;font-size:16px;color:var(--ink);width:100%;background:var(--field);border:0;border-radius:14px;padding:12px 14px;min-height:48px}
input::placeholder{color:var(--mute)}
/* cartões */
/* superfícies coloridas: no claro a cor da lista é o fundo; no escuro vira um tom profundo com a cor nos destaques */
.card,#detail,.mini{--cb:light-dark(var(--c),color-mix(in srgb,var(--c) 26%,#121315));--con:light-dark(#111214,var(--c));--cont:light-dark(#fff,#111214);--conm:light-dark(var(--c),#111214);--cw:light-dark(rgba(255,255,255,.55),rgba(255,255,255,.1));--cw2:light-dark(rgba(255,255,255,.62),rgba(255,255,255,.085));--cw3:light-dark(rgba(255,255,255,.28),rgba(255,255,255,.035));--cl:light-dark(rgba(17,18,20,.1),rgba(255,255,255,.13))}
.card{--c:#a6e6b8;background:var(--cb);color:var(--cink);border-radius:26px;padding:16px 16px 14px;margin-bottom:12px;cursor:pointer;transition:transform .35s cubic-bezier(.32,.72,0,1)}
.card:active{transform:scale(.975)}
.ctop{display:flex;gap:6px;align-items:center}
.tag{font-size:11.5px;padding:3px 9px;border-radius:99px;background:var(--cw);color:color-mix(in srgb,var(--cink) 78%,transparent);white-space:nowrap}
.ago{margin-left:auto;font-size:12px;opacity:.5;white-space:nowrap}
.cttl{display:flex;gap:12px;align-items:center;margin:16px 0 14px}
.mono{flex:none;width:42px;height:42px;border-radius:50%;background:var(--con);color:var(--conm);display:grid;place-items:center;font-weight:700;font-size:19px}
.cttl h2{margin:0;font-size:21px;line-height:1.15;letter-spacing:-.025em;font-weight:500;overflow-wrap:anywhere}
.cttl small{font-size:12.5px;opacity:.6}
.cmid{display:flex;gap:12px;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--cl)}
.cmid p{margin:0;font-size:13px;line-height:1.35;opacity:.75;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bub{display:flex;flex:none;padding-left:7px}
.bub span{width:30px;height:30px;border-radius:50%;margin-left:-7px;display:grid;place-items:center;font-size:11.5px;font-weight:600;background:light-dark(#fff,color-mix(in srgb,var(--c) 36%,#1b1c1f));border:2px solid var(--cb)}
.bub span.more{background:var(--cw)}
.cmeta{display:flex;align-items:center;gap:12px;margin:14px 0 12px;font-size:13px}
.pbar{flex:1;height:6px;border-radius:9px;background:var(--cl);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--con);border-radius:9px;transition:width .7s cubic-bezier(.32,.72,0,1)}
.cmeta span{font-weight:600;white-space:nowrap}
.cacts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.soft,.solid{min-height:44px;border-radius:12px;font-size:14.5px;font-weight:500}
.soft{background:var(--cw)}.solid{background:var(--con);color:var(--cont)}
.sk{height:236px;border-radius:26px;background:var(--soft);margin-bottom:12px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.empty{text-align:center;padding:24px 10px;color:var(--mute)}
.empty h3{color:var(--ink);font-size:22px;letter-spacing:-.03em;margin:0 0 6px;font-weight:600}
.empty p{margin:0 auto 20px;max-width:30ch}
.pile{position:relative;height:180px;width:230px;margin:6px auto 22px}
.pile div{position:absolute;left:20px;right:20px;height:120px;border-radius:22px;padding:16px}
.pile div::before,.pile div::after{content:"";display:block;height:9px;border-radius:9px;background:rgba(17,18,20,.14);width:60%;margin-top:10px}
.pile div::after{width:38%}
.pile .a{top:8px;background:#d2c8f7;transform:rotate(-8deg)}.pile .b{top:30px;background:#f5e08c;transform:rotate(5deg)}.pile .c{top:54px;background:#a6e6b8}
.cta{min-height:52px;padding:0 24px;border-radius:16px;background:var(--ink);color:var(--bg);font-weight:500}
@media(min-width:960px){.wrap{max-width:none;padding-inline:clamp(28px,4vw,72px)}.dwrap{max-width:980px}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}.card,.sk{margin:0}#cards>.empty{grid-column:1/-1}}
/* barra inferior */
.nav{position:fixed;left:50%;bottom:calc(14px + var(--sb));transform:translateX(-50%);width:min(360px,calc(100% - 28px));background:var(--dark);color:#fff;border-radius:22px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;padding:6px 8px;box-shadow:0 12px 32px rgba(0,0,0,.22),inset 0 0 0 1px rgba(255,255,255,.07);z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;min-height:52px;opacity:.55}
.nav button.on{opacity:1}
.nav .plus{width:60px;height:46px;min-height:0;border-radius:15px;background:#fff;color:#111;opacity:1}
/* detalhe */
#detail{position:fixed;inset:0;z-index:10;background:var(--cb);color:var(--cink);overflow-y:auto;overscroll-behavior:contain}
#detail[hidden]{display:none}
#bd{display:none}
@media(min-width:960px){#bd.on{display:block;position:fixed;inset:0;z-index:9;background:rgba(10,10,12,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}#detail{inset:5vh 0;margin:0 auto;width:min(820px,calc(100vw - 64px));border-radius:30px;box-shadow:0 40px 90px rgba(0,0,0,.35);transform-origin:0 0}#detail .dwrap{max-width:none;padding-inline:clamp(24px,3vw,44px);padding-bottom:110px}#detail .dbar{padding-top:18px}#detail .fab{bottom:calc(5vh + 22px)}.wrap{display:grid;grid-template-columns:auto auto minmax(0,1fr) minmax(220px,340px) auto;column-gap:24px;align-items:center;padding-top:28px;padding-bottom:130px}.wrap>*{grid-column:1/-1}.wrap>.brand{grid-column:1;grid-row:1;margin:0;padding-right:22px;border-right:1px solid var(--line);align-self:stretch}.wrap>.hello{grid-column:2;grid-row:1;font-size:40px}.wrap>.who{grid-column:3;grid-row:1;margin:6px 0 0;justify-content:flex-start;align-items:baseline;gap:20px}.wrap>.who small{text-align:left;white-space:nowrap}.wrap>.who b{white-space:nowrap}.tabs .newb svg{flex:none}.wrap>.search{grid-column:4;grid-row:1;display:block;margin:0}.wrap>.tabs{grid-column:5;grid-row:1;margin:0;gap:16px}.wrap>.tabs .vb{margin-left:4px}.wrap>.note{margin:14px 0 0}.wrap>#cards{margin-top:26px}}
@media(min-width:960px) and (max-width:1199px){.wrap>.who{display:none}.wrap{column-gap:16px}}
.dwrap{max-width:640px;margin:0 auto;padding:0 18px calc(120px + var(--sb))}
.dbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;padding:calc(10px + var(--st)) 0 10px;background:var(--cb)}
.rb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--cw)}
.dr{display:flex;gap:8px}
.dtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#dTitle{font-size:clamp(34px,10vw,50px);line-height:1.02;letter-spacing:-.04em;font-weight:600;margin:12px 0 10px;overflow-wrap:anywhere;text-wrap:balance}
.dsum{display:flex;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;font-size:14px}
.dsum span{opacity:.7}.dsum b{font-weight:600;white-space:nowrap}
.dprog{margin:14px 0 20px}
.items{display:flex;flex-direction:column;gap:8px}
.irow{position:relative}
.irow.drag{z-index:3}
.irow.drag .item{background:light-dark(color-mix(in srgb,var(--c) 38%,#fff),color-mix(in srgb,var(--c) 34%,#1f2023));box-shadow:0 14px 30px rgba(0,0,0,.2)}
.del{position:absolute;right:0;top:0;bottom:0;width:0;border-radius:18px;background:#d23b3b;color:#fff;display:grid;place-items:center;overflow:hidden}
.del.go{background:#a61f1f}
.del svg{flex:none}
.item{position:relative;display:flex;align-items:center;gap:6px;background:var(--cw2);border-radius:18px;padding:8px 4px 8px 6px;min-height:62px;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.grip{flex:none;width:32px;height:44px;display:grid;place-items:center;opacity:.38;cursor:grab;touch-action:none}
.grip svg{width:18px;height:18px;fill:currentColor}
.lk{display:none;flex:none;width:26px;height:26px;border-radius:50%;background:var(--cl);color:inherit;text-decoration:none;align-items:center;justify-content:center;font-size:13px}
.hint{font-size:12.5px;opacity:.55;text-align:center;margin:16px 8px 0}
.item.done{background:var(--cw3)}
.item.done b{text-decoration:line-through;opacity:.55}
.chk{flex:none;width:44px;height:44px;display:grid;place-items:center}
.chk svg{width:26px;height:26px;border-radius:50%;border:1.8px solid color-mix(in srgb,var(--cink) 40%,transparent);padding:4px;stroke:transparent;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;transition:background .2s,border-color .2s}
.done .chk svg{background:var(--con);border-color:var(--con);stroke:var(--conm)}
.ib{flex:1;cursor:pointer;padding:6px 4px;border-radius:10px}
.iname{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.iname b{font-weight:500;font-size:16.5px;letter-spacing:-.01em;overflow-wrap:anywhere}
.qty{flex:none;font-size:12.5px;padding:1px 8px;border-radius:99px;background:var(--cl);white-space:nowrap}
.imeta{font-size:13px;margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 10px;opacity:.7}
.lnk{color:inherit;text-underline-offset:2px;white-space:nowrap;display:inline-flex;align-items:center;min-height:24px}
.inote{flex-basis:100%;overflow-wrap:anywhere}
.ipr{font-weight:600;font-size:14.5px;white-space:nowrap}
.sec{display:flex;justify-content:space-between;align-items:center;margin:20px 4px 6px;font-size:13.5px}
.sec span{opacity:.65}.sec button{text-decoration:underline;text-underline-offset:2px;min-height:44px}
.dempty{text-align:center;padding:40px 10px}
.dempty p{opacity:.7;margin:0 0 18px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--sb));background:var(--con);color:var(--cont);border-radius:18px;height:56px;padding:0 26px;display:flex;align-items:center;gap:8px;font-size:15.5px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.22);z-index:11;white-space:nowrap}
/* folha inferior */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.36);opacity:0;pointer-events:none;transition:opacity .45s ease;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--sheet);color:var(--ink);border-radius:26px 26px 0 0;padding:10px 18px calc(18px + var(--sb));z-index:21;transform:translateY(calc(100% + 40px));transition:transform .52s cubic-bezier(.32,.72,0,1),visibility 0s .52s;max-height:92dvh;overflow-y:auto;visibility:hidden}
.sheet.on{transform:none;visibility:visible;transition:transform .52s cubic-bezier(.32,.72,0,1),visibility 0s}
@media(min-width:700px){.sheet{bottom:24px;border-radius:26px}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 8px}
.shd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.shd h3{margin:0;font-size:22px;letter-spacing:-.03em;font-weight:600}
.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--field)}
.f{display:block;margin-bottom:12px}
.f>span{display:block;font-size:13px;color:var(--mute);margin:0 0 6px 4px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.step{display:flex;align-items:center;background:var(--field);border-radius:14px}
.step button{width:44px;height:48px;font-size:21px;flex:none}
.step input{text-align:center;background:none;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{padding:0 13px;border-radius:99px;background:var(--field);font-size:13.5px;min-height:38px}
.sw{display:flex;flex-wrap:wrap;gap:10px;padding:4px}
.sw label{position:relative;cursor:pointer}
.sw input,.seg input{position:absolute;opacity:0;width:1px;height:1px;min-height:0;padding:0}
.sw span{display:block;width:40px;height:40px;border-radius:50%;background:var(--s);box-shadow:inset 0 0 0 1px rgba(0,0,0,.07)}
.sw input:checked+span{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--ink)}
.sw input:focus-visible+span{outline:2px solid #3a7bff;outline-offset:6px}
.mini{display:flex;align-items:center;gap:12px;background:var(--cb);color:var(--cink);border-radius:18px;padding:12px;margin-bottom:14px;transition:background .25s}
.mini .mono{width:36px;height:36px;font-size:16px}
.mini b{font-weight:500;font-size:17px;overflow-wrap:anywhere}
.sbtns{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;min-height:52px;border-radius:15px;font-size:16px;font-weight:500;background:var(--field)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.del{color:#d23b3b;flex:0 0 auto;padding:0 18px}
.btn.danger{background:#d23b3b;color:#fff}
.added{font-size:13.5px;color:#22995a;min-height:20px;margin:2px 4px 0}
.sheet p.msg{margin:0 0 6px;color:var(--mute)}
.syncbox{background:var(--field);border-radius:16px;padding:12px}
.syncbox p{margin:0 0 10px;font-size:14px;color:var(--mute)}
.syncbox input{background:var(--sheet);font-size:14px}
.syncbox .btn{background:var(--sheet);min-height:46px;font-size:15px}
#toast{position:fixed;left:50%;top:calc(14px + var(--st));transform:translate(-50%,-16px);opacity:0;background:var(--dark);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;transition:opacity .45s ease,transform .45s cubic-bezier(.32,.72,0,1);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.act{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 16px;white-space:nowrap;top:auto;bottom:calc(88px + var(--sb));transform:translate(-50%,16px)}
#toast.act.on{transform:translate(-50%,0)}
#toast.act.on{pointer-events:auto}
#toast button{color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:2px;min-height:36px;padding:0 10px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:var(--field);border-radius:14px;padding:4px}
.seg label{position:relative;cursor:pointer}
.seg span{transition:background-color .3s ease,box-shadow .3s ease;display:block;text-align:center;font-size:14px;line-height:40px;border-radius:11px;white-space:nowrap}
.seg input:checked+span{background:var(--sheet);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg input:focus-visible+span{outline:2px solid #3a7bff;outline-offset:1px}
#scrim.clear{background:transparent}
.sheet.top{top:calc(8px + var(--st));bottom:auto;left:8px;right:8px;max-width:520px;border-radius:22px;padding:8px 12px 12px;transform:translateY(calc(-100% - 40px));box-shadow:0 18px 50px rgba(0,0,0,.22);max-height:calc(100dvh - 24px)}
.sheet.top.on{transform:none}
.sheet.top .grab{display:none}.sheet.top .shd{margin-bottom:6px}.sheet.top .shd h3{font-size:17px}.sheet.top .x{width:36px;height:36px}
.vrow{display:grid;grid-template-columns:70px minmax(0,1fr);align-items:center;gap:8px;margin-bottom:6px}.vrow>span{font-size:13px;color:var(--mute)}.vrow .seg{padding:3px;border-radius:12px}.vrow .seg span{line-height:32px;font-size:13px;border-radius:9px}
.sync{margin-top:6px}.sync summary{cursor:pointer;font-size:13.5px;padding:8px 2px}.sync summary small{color:var(--mute);margin-left:6px}.sync .syncbox{margin-top:4px}
@media(min-width:960px){.sheet.top{left:auto;right:clamp(28px,4vw,72px);top:84px;width:440px;margin:0}}
/* densidade da interface: k = compacta, m = mínima */
[data-d=k] .hello{font-size:clamp(38px,11vw,48px)}
[data-d=k] .tabs{margin:20px 0 8px}
[data-d=k] .card{padding:12px 14px 10px;border-radius:20px;margin-bottom:8px}

<body>
<main class="wrap">
  <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="17" fill="#a6e6b8"/><circle cx="19.5" cy="21" r="4.6" fill="#111214"/><path d="M31 21h14.5L18.5 43h27" fill="none" stroke="#111214" stroke-width="7.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Lizta</div>
  <h1 class="hello">Olá</h1>

  <div class="tabs" role="tablist">

<div id="toast" role="status"></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=[['Verde','#a6e6b8'],['Lima','#dcf27a'],['Amarelo','#f5e08c'],['Laranja','#f9c99d'],['Rosa','#f7c3d3'],['Lilás','#d2c8f7'],['Azul','#bcd9f7'],['Menta','#b6ece2'],['Cinza','#dfe2e6']];
const TAGS=['Mercado','Online','Casa','Presentes','Farmácia','Viagem'];
const brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>setTheme());
const X='<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const okC=c=>/^#[0-9a-f]{6}$/i.test(c||'')?c:COLORS[0][1];
const fmtQ=n=>String(+n||1).replace('.',',');
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}};
let lists=[],tab='ativas',query='',openId=null,loaded=false;
let g=null,noClick=0,hint=true,firstPaint=true;
const EZ='cubic-bezier(.32,.72,0,1)',view={d:'c',t:'f',m:'a'};
const hex2=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
try{const v=JSON.parse(localStorage.getItem('app-listas-view')||'{}');if(['c','k','m'].includes(v.d))view.d=v.d;if(['f','s','e'].includes(v.t))view.t=v.t;if(['a','l','d'].includes(v.m))view.m=v.m;hint=!localStorage.getItem('app-listas-hint')}catch(e){}
function applyView(save){const r=document.documentElement;r.dataset.d=view.d;r.dataset.t=view.t;if(view.m==='a')delete r.dataset.mode;else r.dataset.mode=view.m;setTheme();if(save)try{localStorage.setItem('app-listas-view',JSON.stringify(view))}catch(e){}}
applyView();
function seen(){if(!hint)return;hint=false;try{localStorage.setItem('app-listas-hint','1')}catch(e){}}
const sh=$('#sheet'),scrim=$('#scrim'),det=$('#detail');

$('#today').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});

function parseNum(v){v=String(v??'').trim().replace(/[R$\s]/g,'');if(!v)return null;if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');const n=parseFloat(v);return isFinite(n)&&n>=0?Math.round(n*100)/100:null}
function fixUrl(u){u=(u||'').trim();if(!u)return '';if(!/^https?:\/\//i.test(u))u='https://'+u;try{const x=new URL(u);return /^https?:$/.test(x.protocol)&&x.hostname.includes('.')?x.href:''}catch(e){return ''}}
function stats(l){const it=l.items||[];let total=0,cart=0,priced=0,done=0;for(const i of it){if(i.done)done++;if(i.price!=null){const v=i.price*(i.qty||1);total+=v;priced++;if(i.done)cart+=v}}return{n:it.length,done,total,cart,priced}}
function ago(t){if(!t)return '';const m=Math.round((Date.now()-t)/60000);if(m<1)return 'agora';if(m<60)return `há ${m} min`;const h=Math.round(m/60);if(h<24)return `há ${h} h`;const d=Math.round(h/24);return d<30?`há ${d} d`:new Date(t).toLocaleDateString('pt-BR')}
const byId=id=>lists.find(l=>l.id===id);
function toast(t,undo){const el=$('#toast');el.textContent=t;el.classList.toggle('act',!!undo);if(undo){const b=document.createElement('button');b.type='button';b.textContent='Desfazer';b.onclick=()=>{el.classList.remove('on');undo()};el.append(b)}el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),undo?5500:2200)}
function setNote(t){const n=$('#note');n.textContent=t;n.hidden=!t}
function isDark(){const t=document.documentElement.dataset.theme;return view.m==='d'||(view.m==='a'&&(t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches))}
function setTheme(){const l=openId&&byId(openId),d=isDark();let v=d?'#0c0d0f':'#e7e7e4';if(l){const c=okC(l.color);v=d?'#'+hex2(c).map((x,i)=>Math.round(x*.26+[18,19,21][i]*.74).toString(16).padStart(2,'0')).join(''):c}$('#tc').content=v}
function vt(fn){if(RM||!document.startViewTransition)return fn();let t;try{t=document.startViewTransition(fn)}catch(e){return fn()}for(const k of ['ready','finished','updateCallbackDone'])if(t&&t[k])t[k].catch(()=>{})}

/* armazenamento: cópia local + sincronização pela API (/api/lists) */
const LK='lizta-lists',KK='lizta-key',PK='lizta-pending';
let key='',pend={},syncing=false,online=false,timer=0;
function loadLocal(){try{lists=JSON.parse(localStorage.getItem(LK)||localStorage.getItem('app-listas')||'[]')}catch(e){lists=[]}try{pend=JSON.parse(localStorage.getItem(PK)||'{}')}catch(e){pend={}}}
function saveLocal(){try{localStorage.setItem(LK,JSON.stringify(lists));localStorage.setItem(PK,JSON.stringify(pend))}catch(e){}}
const clean=l=>JSON.parse(JSON.stringify({id:l.id,name:l.name,color:l.color,tag:l.tag||'',created:l.created,updated:l.updated,items:l.items||[]}));
function newKey(){const a=new Uint8Array(18);crypto.getRandomValues(a);return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_')}
const okKey=k=>/^[A-Za-z0-9_-]{20,64}$/.test(k||'');
function setKey(k){key=k;try{localStorage.setItem(KK,k)}catch(e){}}
function status(ok,msg){online=ok;$('#dot').classList.toggle('off',!ok);setNote(msg||'')}
function persist(l){l.updated=Date.now();const ix=lists.findIndex(x=>x.id===l.id);if(ix>=0)lists[ix]=l;pend[l.id]=1;saveLocal();queue()}
function dropList(id){lists=lists.filter(x=>x.id!==id);pend[id]='del';saveLocal();queue()}
function queue(d){clearTimeout(timer);timer=setTimeout(sync,d==null?350:d)}
async function api(method,body){
  const r=await fetch('/api/lists',{method,headers:{'Content-Type':'application/json','X-Lizta-Key':key},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  if(!r.ok){const e=new Error('http');e.status=r.status;throw e}
  return r.json();
}
async function sync(){
  if(syncing){queue(800);return}
  syncing=true;
  try{
    const sent={...pend},put=[],del=[];
    for(const id in sent){if(sent[id]==='del')del.push(id);else{const l=byId(id);if(l)put.push(clean(l))}}
    if(put.length||del.length)await api('POST',{put,del});
    for(const id in sent)if(pend[id]===sent[id])delete pend[id];
    const {lists:srv}=await api('GET');
    if(g&&g.k!=='tap'){saveLocal();syncing=false;queue(1500);return}
    const keep=lists.filter(l=>pend[l.id]&&pend[l.id]!=='del');
    const next=srv.filter(l=>l&&l.id&&!pend[l.id]).map(l=>Object.assign({items:[]},l));
    lists=next.concat(keep);saveLocal();loaded=true;
    status(true,'');render();if(openId){if(byId(openId))renderDetail();else closeDetail()}
  }catch(e){
    if(e.status===503)status(false,'Sincronização ainda não ativada no servidor: salvando só neste aparelho.');
    else status(false,navigator.onLine===false?'Sem internet: as mudanças ficam guardadas e sobem quando voltar.':'Não consegui sincronizar agora. Tento de novo em instantes.');
    saveLocal();
  }finally{syncing=false}
  if(Object.keys(pend).length)queue(online?1200:8000);
}
function init(){
  const u=new URL(location.href),k=u.searchParams.get('k');
  loadLocal();
  let cur='';try{cur=localStorage.getItem(KK)||''}catch(e){}
  if(okKey(k)&&k!==cur){setKey(k);for(const l of lists)pend[l.id]=1;toast('Aparelho conectado às suas listas')}
  else if(okKey(cur))key=cur;else setKey(newKey());
  if(k){u.searchParams.delete('k');history.replaceState(null,'',u.pathname+u.search+u.hash)}
  saveLocal();loaded=true;render();sync();
  setInterval(()=>{if(document.visibilityState==='visible')sync()},9000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
  addEventListener('online',()=>sync());addEventListener('focus',()=>sync());
}
function joinCode(v){
  v=(v||'').trim();let k=v;try{const x=new URL(v);k=x.searchParams.get('k')||''}catch(e){}
  if(!okKey(k))return toast('Código ou link inválido');
  if(k===key)return toast('Este aparelho já usa esse código');
  setKey(k);for(const l of lists)pend[l.id]=1;saveLocal();closeSheet();toast('Aparelho conectado às suas listas');sync();
}
/* home */
function card(l){
  const s=stats(l),it=l.items||[],pend=it.filter(i=>!i.done),src=pend.length?pend:it;
  const prev=src.slice(0,4).map(i=>i.name).join(', ')+(src.length>4?'…':'');
  const b=src.slice(0,3).map(i=>`<span>${esc((i.name||'?').trim().charAt(0).toUpperCase())}</span>`).join('');
  const more=src.length>3?`<span class="more">${src.length-3}+</span>`:'';
  return `<article class="card" data-id="${esc(l.id)}" style="--c:${okC(l.color)}" tabindex="0" aria-label="Abrir ${esc(l.name)}">
  <div class="ctop">${l.tag?`<span class="tag">${esc(l.tag)}</span>`:''}<span class="tag">${s.n} ${s.n===1?'item':'itens'}</span><span class="ago">${ago(l.updated)}</span></div>
  <div class="cttl"><span class="mono">${esc((l.name||'?').trim().charAt(0).toUpperCase())}</span><div><h2>${esc(l.name)}</h2><small>${s.n?`${s.done} de ${s.n} marcados`:'Lista vazia'}</small></div></div>
  <div class="cmid"><p>${prev?esc(prev):'Toque para adicionar o primeiro item'}</p>${it.length?`<div class="bub">${more}${b}</div>`:''}</div>
  <div class="cmeta"><div class="pbar"><i style="width:${s.n?s.done/s.n*100:0}%"></i></div>${s.priced?`<span>${brl.format(s.total)}</span>`:''}</div>
  <div class="cacts"><button class="soft" data-add>Adicionar item</button><button class="solid">Abrir</button></div></article>`;
}
const finished=l=>{const s=stats(l);return s.n>0&&s.done===s.n};
function render(){
  const act=lists.filter(l=>!finished(l)),fin=lists.filter(finished);
  $('#cA').textContent=act.length;$('#cF').textContent=fin.length;
  if(!loaded)return;
  let show=tab==='ativas'?act:fin;
  if(query)show=lists.filter(l=>(l.name+' '+(l.tag||'')+' '+(l.items||[]).map(i=>i.name+' '+(i.note||'')).join(' ')).toLowerCase().includes(query));
  show=show.slice().sort((a,b)=>(b.created||0)-(a.created||0));
  let html=show.map(card).join('');
  if(!show.length){
    if(query)html=`<div class="empty"><h3>Nada encontrado</h3><p>Nenhuma lista ou item com “${esc(query)}”.</p></div>`;
    else if(tab==='ok')html=`<div class="empty"><h3>Nada concluído ainda</h3><p>Quando todos os itens de uma lista forem marcados, ela aparece aqui.</p></div>`;
    else html=`<div class="empty"><div class="pile" aria-hidden="true"><div class="a"></div><div class="b"></div><div class="c"></div></div><h3>${lists.length?'Tudo concluído':'Nenhuma lista ainda'}</h3><p>Crie uma lista para o mercado, compras online ou o que precisar.</p><button class="cta" data-new>Criar lista</button></div>`;
  }
  $('#cards').innerHTML=html;
  if(firstPaint){firstPaint=false;if(!RM)document.querySelectorAll('#cards>*').forEach((c,i)=>c.animate([{opacity:0,transform:'translateY(24px)'},{opacity:1,transform:'none'}],{duration:640,delay:i*70,easing:EZ,fill:'backwards'}))}
}
$('#cards').addEventListener('click',e=>{
  if(e.target.closest('[data-new]'))return listSheet();
  const c=e.target.closest('.card');if(!c)return;
  openDetail(c.dataset.id,c,!!e.target.closest('[data-add]'));
});
$('#cards').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('card'))openDetail(e.target.dataset.id,e.target)});
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>vt(()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b));render()})));
$('#q').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});
$('#nList').addEventListener('click',()=>{query='';$('#q').value='';$('#search').classList.remove('on');$('#nFind').classList.remove('on');scrollTo({top:0,behavior:RM?'auto':'smooth'});render()});
$('#nFind').addEventListener('click',()=>{const on=$('#search').classList.toggle('on');$('#nFind').classList.toggle('on',on);if(on){scrollTo({top:0});$('#q').focus()}else{query='';$('#q').value='';render()}});
$('#nNew').addEventListener('click',()=>listSheet());
$('#nNew2').addEventListener('click',()=>listSheet());

/* detalhe */
const clipOf=el=>{const r=el.getBoundingClientRect();return `inset(${r.top}px ${innerWidth-r.right}px ${innerHeight-r.bottom}px ${r.left}px round ${parseFloat(getComputedStyle(el).borderRadius)||26}px)`};
const FULL='inset(0px 0px 0px 0px round 0px)',homeEl=$('.wrap');
const DESK=matchMedia('(min-width:960px)');
const fromCard=el=>{if(!DESK.matches)return{clipPath:clipOf(el)};const r=el.getBoundingClientRect(),d=det.getBoundingClientRect();return{transform:`translate(${r.left-d.left}px,${r.top-d.top}px) scale(${r.width/d.width},${r.height/d.height})`}};
const toFull=()=>DESK.matches?{transform:'none'}:{clipPath:FULL};
function bd(on){const b=$('#bd');if(on){b.getAnimations().forEach(x=>x.cancel());b.classList.add('on');if(!RM&&DESK.matches)b.animate([{opacity:0},{opacity:1}],{duration:400,easing:'ease'})}else if(b.classList.contains('on')){if(RM||!DESK.matches)return b.classList.remove('on');b.animate([{opacity:1},{opacity:0}],{duration:420,easing:'ease',fill:'forwards'}).onfinish=()=>{if(openId)return;b.classList.remove('on');b.getAnimations().forEach(x=>x.cancel())}}}
function homeAnim(out){
  homeEl.style.transformOrigin=`50% ${scrollY+innerHeight/2-homeEl.offsetTop}px`;
  const a={transform:'none',opacity:1},b={transform:'scale(.95)',opacity:.5};
  homeEl.animate(out?[a,b]:[b,a],{duration:out?700:600,easing:EZ});
}
function openDetail(id,el,add){
  const l=byId(id);if(!l)return;
  openId=id;det.style.setProperty('--c',okC(l.color));renderDetail();
  det.hidden=false;det.scrollTop=0;document.body.classList.add('lock');setTheme();bd(true);
  const anim=el&&!RM;

/* excluir com desfazer, reordenar */
function removeItem(lid,iid){
  const l=byId(lid);if(!l)return;const idx=(l.items||[]).findIndex(i=>i.id===iid);if(idx<0)return renderDetail();
  const it=l.items.splice(idx,1)[0];persist(l);renderDetail();render();

}
function reorder(l,ids){
  const set=new Set(ids),map=new Map((l.items||[]).map(i=>[i.id,i]));
  if(ids.some(id=>!map.has(id))||l.items.filter(i=>set.has(i.id)).length!==ids.length)return renderDetail();
  let k=0;l.items=l.items.map(it=>set.has(it.id)?map.get(ids[k++]):it);
  seen();persist(l);renderDetail();render();
}
/* gestos: deslizar para excluir, arrastar pelos pontinhos para reordenar */
$('#items').addEventListener('pointerdown',e=>{
  if(g||e.button>0)return;const r=e.target.closest('.irow');if(!r)return;
  if(e.target.closest('.grip')){
    e.preventDefault();const rows=[...r.parentElement.children],rc=rows.map(x=>x.getBoundingClientRect());

    g.to=g.i;r.classList.add('drag');rows.forEach(x=>{if(x!==r)x.style.transition='transform .28s '+EZ});g.raf=requestAnimationFrame(dragTick);return;
  }

});
function dragLay(){
  const s=g,me=s.rc[s.i],h=me.height+s.gap;
  const dy=Math.max(s.rc[0].top-me.top,Math.min(s.rc[s.rc.length-1].bottom-me.bottom,s.cy-s.y+det.scrollTop-s.sc)),mid=me.top+me.height/2+dy;
  let to=s.i;
  s.rows.forEach((r,j)=>{if(j===s.i)return;const m=s.rc[j].top+s.rc[j].height/2;let t=0;if(j<s.i&&mid<m){t=h;to--}else if(j>s.i&&mid>m){t=-h;to++}r.style.transform=t?`translateY(${t}px)`:''});
  s.to=to;s.row.style.transform=`translateY(${dy}px)`;
}
function dragTick(){
  if(!g||g.k!=='drag')return;const y=g.cy,H=innerHeight;let v=0;
  if(y<96)v=-Math.ceil((96-y)/8);else if(y>H-120)v=Math.ceil((y-(H-120))/8);
  if(v){const b=det.scrollTop;det.scrollTop=b+v;if(det.scrollTop!==b)dragLay()}
  g.raf=requestAnimationFrame(dragTick);
}
addEventListener('pointermove',e=>{
  if(!g||e.pointerId!==g.id)return;
  if(g.k==='drag'){g.cy=e.clientY;dragLay();return}
  const dx=e.clientX-g.x,dy=e.clientY-g.y;
  if(g.k==='tap'){
    if(Math.abs(dy)>10&&Math.abs(dy)>=Math.abs(dx)){g=null;return}
    if(Math.abs(dx)<10)return;
    g.k='swipe';g.th=Math.min(150,g.row.offsetWidth*.38);g.item.style.transition='none';g.bg.style.transition='none';
  }
  g.dx=Math.min(0,dx);g.item.style.transform=`translateX(${g.dx}px)`;g.bg.style.width=Math.max(0,-g.dx-6)+'px';g.bg.classList.toggle('go',-g.dx>g.th);
});
function endG(e,cancel){
  if(!g||e.pointerId!==g.id)return;const s=g;g=null;
  if(s.k==='tap')return;noClick=Date.now();
  if(s.k==='drag'){
    cancelAnimationFrame(s.raf);const to=cancel?s.i:s.to;let t=0;
    if(to>s.i)for(let j=s.i+1;j<=to;j++)t+=s.rc[j].height+s.gap;else for(let j=to;j<s.i;j++)t-=s.rc[j].height+s.gap;
    s.row.style.transition='transform .26s '+EZ;s.row.style.transform=`translateY(${t}px)`;
    if(cancel)s.rows.forEach(r=>{if(r!==s.row)r.style.transform=''});
    setTimeout(()=>{const l=byId(openId);if(l&&to!==s.i){const ids=s.rows.map(r=>r.dataset.i);ids.splice(to,0,ids.splice(s.i,1)[0]);reorder(l,ids)}else renderDetail()},RM?0:270);
    return;
  }
  if(!cancel&&-s.dx>s.th&&openId){
    const lid=openId;seen();
    s.item.style.transition='transform .3s ease-in';s.item.style.transform='translateX(-110%)';s.bg.style.transition='width .3s ease-in';s.bg.style.width='100%';
    setTimeout(()=>removeItem(lid,s.row.dataset.i),RM?0:300);
  }else{
    s.item.style.transition='transform .42s '+EZ;s.item.style.transform='';s.bg.style.transition='width .42s '+EZ;s.bg.style.width='0px';
    setTimeout(()=>{s.item.style.transition='';s.bg.style.transition='';if(s.stale)renderDetail()},430);
  }
}
addEventListener('pointerup',e=>endG(e,false));
addEventListener('pointercancel',e=>endG(e,true));
